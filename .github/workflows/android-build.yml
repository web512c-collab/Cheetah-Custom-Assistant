name: Sheeta Android CI - Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g. v0.5.1) to create or update a GitHub Release and attach the APK'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Sheeta APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure preinstalled Android SDK & install platform 36.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle & cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable & debug keystore exists
        run: |
          chmod +x gradlew
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "::error::Both debug.keystore and debug.keystore.base64 are missing. Refusing to generate a mismatched keystore."
              exit 1
            fi
          fi

      - name: Resolve release metadata and version tag
        id: release_meta
        run: |
          EVENT_NAME="${{ github.event_name }}"
          INPUT_TAG="${{ github.event.inputs.tag }}"
          RELEASE_EVENT_TAG="${{ github.event.release.tag_name }}"
          APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')

          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_EVENT_TAG" ]; then
            VERSION_TAG="$RELEASE_EVENT_TAG"
            SHOULD_RELEASE="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
            SHOULD_RELEASE="true"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            VERSION_TAG="$INPUT_TAG"
            SHOULD_RELEASE="true"
          else
            VERSION_TAG="v${APP_VER}"
            SHOULD_RELEASE="false"
          fi

          echo "Event: $EVENT_NAME | Ref: $GITHUB_REF | Tag: $VERSION_TAG | ShouldRelease: $SHOULD_RELEASE"
          echo "tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_ENV"

      - name: Run core JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.example.CheetahCoreUnitTest" --tests "com.example.WakeWordBinaryModelTest" --tests "com.example.WakeStateMachineUnitTest" --tests "com.example.V030FeaturesUnitTest" --tests "com.example.V040AiBrainUnitTest" --tests "com.example.V041SearchEnginesUnitTest" --tests "com.example.V050SheetaFeaturesUnitTest" --tests "com.example.V051RepairAndVoiceUnitTest" --tests "com.example.StaticNetworkBoundaryTest" --no-daemon

      - name: Run Robolectric smoke test (non-blocking)
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --tests "com.example.SheetaAppRobolectricSmokeTest" --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Package & verify versioned Debug APK
        id: package_apk
        run: |
          echo "=== Contents of app/build/outputs/apk/debug/ ==="
          ls -la app/build/outputs/apk/debug/ || true

          SOURCE_APK=""
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          else
            SOURCE_APK=$(find app/build/outputs/apk/debug -maxdepth 2 -type f -name '*.apk' | sort | head -n 1)
          fi

          if [ -z "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Built Debug APK not found or empty under app/build/outputs/apk/debug/"
            exit 1
          fi

          mkdir -p dist
          APK_NAME="Sheeta-${{ steps.release_meta.outputs.tag }}-debug.apk"
          DEST_APK="dist/${APK_NAME}"
          cp -f "$SOURCE_APK" "$DEST_APK"

          if [ ! -s "$DEST_APK" ]; then
            echo "::error::Failed to produce non-empty versioned APK at $DEST_APK"
            exit 1
          fi

          ls -lh dist/
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-debug-apk
          path: ${{ steps.package_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Check optional release signing secrets
        id: release_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK (optional)
        if: steps.release_secrets.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          ./gradlew assembleRelease --no-daemon
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/Sheeta-${{ steps.release_meta.outputs.tag }}-release.apk"
          fi

      - name: Clean up decoded release keystore
        if: always()
        run: rm -f my-upload-key.jks

      - name: Upload Signed Release APK Artifact (optional)
        if: steps.release_secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sheeta-release-apk
          path: dist/Sheeta-*-release.apk
          if-no-files-found: ignore

      - name: Extract release notes from CHANGELOG.md
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          mkdir -p dist
          awk -v tag="${{ steps.release_meta.outputs.tag }}" '
            index($0, "## " tag " ") == 1 || index($0, "## " tag "(") == 1 || $0 == "## " tag { in_section=1; next }
            in_section && index($0, "## v") == 1 { exit }
            in_section { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md || true
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "Sheeta Custom Assistant ${{ steps.release_meta.outputs.tag }} pre-release. See CHANGELOG.md for details." > dist/RELEASE_NOTES.md
          fi
          cat dist/RELEASE_NOTES.md

      - name: Publish or Update GitHub Release with APK
        id: gh_release
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Sheeta Custom Assistant ${{ steps.release_meta.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ steps.package_apk.outputs.apk_path }}

      - name: Print published release URL and attached asset
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          echo "Published Release URL: ${{ steps.gh_release.outputs.url }}"
          echo "Attached APK Asset Name: ${{ steps.package_apk.outputs.apk_name }}"
          echo "Attached APK Asset Path: ${{ steps.package_apk.outputs.apk_path }}"
